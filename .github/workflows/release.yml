# Pushing a tag (e.g. v1.0.0) builds the zip with the BigWigs packager and uploads it to GitHub Releases,
# and to CurseForge / Wago / WoWInterface once their project IDs are in the TOC (## X-Curse-Project-ID,
# ## X-Wago-ID, ## X-WoWI-ID) and the matching API keys are saved as repository secrets.
name: Package and release

on:
  push:
    tags:
      - "**"

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
