# Pushing a tag (e.g. v1.0.0) builds the zip with the BigWigs packager and uploads it to CurseForge
# (## X-Curse-Project-ID in the TOC + the CF_API_KEY repository secret) and to GitHub Releases.
# Tags containing "alpha" or "beta" (e.g. v1.0.1-beta1) are uploaded as alpha / beta files.
# Wago / WoWInterface can be added later: put ## X-Wago-ID / ## X-WoWI-ID in the TOC and save the token secrets.
#
# "Run workflow" on the Actions tab (workflow_dispatch) builds the zip WITHOUT uploading anything and
# attaches it to the run, to check the packaging before a real release.
name: Package and release

on:
  push:
    tags:
      - "**"
  workflow_dispatch:

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2

  test-build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
        with:
          args: -d
      - uses: actions/upload-artifact@v4
        with:
          name: PeggleForever-test-build
          path: .release/*.zip
          include-hidden-files: true # .release/ starts with a dot
